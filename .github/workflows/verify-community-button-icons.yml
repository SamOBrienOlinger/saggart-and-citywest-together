name: Verify Community button icons
on:
  push:
    branches: [fix/community-button-icons-20261016]
    paths: [.github/workflows/verify-community-button-icons.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add exactly two copies of the existing icon and scoped responsive layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('learn.html')
          original = p.read_text()
          icon = '<img class="explore-topic-icon" src="assets/icons/chat-heart.svg" width="24" height="24" alt="">'
          old = '<a class="explore-topic explore-topic--community" href="#community" style="--reveal-order:5">' + icon + '<span class="explore-topic-label">Community</span></a>'
          new = old.replace(icon, '<span class="explore-community-icons" aria-hidden="true">' + icon * 3 + '</span>')
          assert original.count(old) == 1
          old_version = 'assets/css/explore.css?v=20260913-1'
          new_version = 'assets/css/explore.css?v=community-icons-20261016'
          assert original.count(old_version) == 1
          updated = original.replace(old, new, 1).replace(old_version, new_version, 1)
          assert updated.replace(new, old, 1).replace(new_version, old_version, 1) == original
          p.write_text(updated)
          css = Path('assets/css/explore.css')
          css.write_text(css.read_text() + '''
          /* Keep the three existing Community icons together; wrap the label when needed. */
          :root body[data-page="learn"] .explore-topic--community { flex-wrap: wrap; }
          :root body[data-page="learn"] .explore-community-icons {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .25rem;
            flex: 0 0 auto;
            max-inline-size: 100%;
          }
          ''')
          PY
          cat > e2e/community-button-icons.spec.js <<'JS'
          import { test, expect } from '@playwright/test';

          const selector = '.explore-topic--community';
          async function checkIcons(page) {
            const button = page.locator(selector);
            await expect(button).toHaveAccessibleName('Community');
            await expect(button).toHaveAttribute('href', '#community');
            await expect(button.locator('.explore-topic-label')).toHaveText('Community');
            await expect(button.locator('.explore-community-icons')).toHaveAttribute('aria-hidden', 'true');
            const icons = button.locator('img');
            await expect(icons).toHaveCount(3);
            for (const icon of await icons.all()) {
              await expect(icon).toHaveAttribute('src', 'assets/icons/chat-heart.svg');
              await expect(icon).toHaveAttribute('alt', '');
              await expect.poll(() => icon.evaluate(image => image.complete && image.naturalWidth > 0)).toBe(true);
            }
            const appearances = await icons.evaluateAll(images => images.map(image => {
              const style = getComputedStyle(image);
              return [style.width, style.height, style.filter, style.objectFit];
            }));
            expect(appearances[1]).toEqual(appearances[0]);
            expect(appearances[2]).toEqual(appearances[0]);
            for (const other of await page.locator('.explore-topic:not(.explore-topic--community)').all()) {
              await expect(other.locator('img')).toHaveCount(1);
            }
            return button;
          }

          test('Community has three identical icons and keeps keyboard and pointer navigation', async ({ page, hasTouch }, info) => {
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto('/learn.html');
            let button = await checkIcons(page);
            await button.scrollIntoViewIfNeeded();
            await page.locator('.explore-topic-nav').screenshot({ path: info.outputPath('community-icons.png') });
            if (!hasTouch) {
              await button.hover();
              await checkIcons(page);
            }
            await button.press('Enter');
            await expect(page).toHaveURL(/learn\.html#community$/);
            await expect(page.locator('#community')).toBeInViewport();
            await page.goto('/learn.html');
            button = await checkIcons(page);
            if (hasTouch) await button.tap();
            else await button.click();
            await expect(page).toHaveURL(/learn\.html#community$/);
            await expect(page.locator('#community')).toBeInViewport();
          });

          test('three icons and the label fit at narrow widths, enlarged text and RTL', async ({ page }) => {
            await page.goto('/learn.html');
            const button = await checkIcons(page);
            for (const width of [280, 320, 390, 768, 1440]) {
              await page.setViewportSize({ width, height: 900 });
              for (const [fontSize, dir] of [['100%', 'ltr'], ['200%', 'ltr'], ['200%', 'rtl']]) {
                await page.evaluate(({ fontSize, dir }) => {
                  document.documentElement.style.fontSize = fontSize;
                  document.documentElement.dir = dir;
                }, { fontSize, dir });
                await button.scrollIntoViewIfNeeded();
                const geometry = await button.evaluate(link => {
                  const bounds = link.getBoundingClientRect();
                  const children = [...link.querySelectorAll('img, .explore-topic-label')].map(child => {
                    const rect = child.getBoundingClientRect();
                    return { left: rect.left, right: rect.right, top: rect.top, bottom: rect.bottom, width: rect.width, height: rect.height };
                  });
                  return { left: bounds.left, right: bounds.right, top: bounds.top, bottom: bounds.bottom, height: bounds.height, client: link.clientWidth, scroll: link.scrollWidth, children };
                });
                expect(geometry.height).toBeGreaterThanOrEqual(48);
                expect(geometry.scroll).toBeLessThanOrEqual(geometry.client + 1);
                for (const rect of geometry.children) {
                  expect(rect.width).toBeGreaterThan(0);
                  expect(rect.height).toBeGreaterThan(0);
                  expect(rect.left).toBeGreaterThanOrEqual(geometry.left - 1);
                  expect(rect.right).toBeLessThanOrEqual(geometry.right + 1);
                  expect(rect.top).toBeGreaterThanOrEqual(geometry.top - 1);
                  expect(rect.bottom).toBeLessThanOrEqual(geometry.bottom + 1);
                }
                const icons = geometry.children.slice(0, 3).sort((a, b) => a.left - b.left);
                expect(icons[1].left).toBeGreaterThanOrEqual(icons[0].right);
                expect(icons[2].left).toBeGreaterThanOrEqual(icons[1].right);
              }
            }
          });

          test('Community icons and anchor work without JavaScript', async ({ browser, baseURL }) => {
            const context = await browser.newContext({ javaScriptEnabled: false, reducedMotion: 'reduce' });
            const page = await context.newPage();
            try {
              await page.goto(new URL('/learn.html', baseURL).href);
              const button = await checkIcons(page);
              await button.click();
              await expect(page).toHaveURL(/learn\.html#community$/);
              await expect(page.locator('#community')).toBeInViewport();
            } finally { await context.close(); }
          });
          JS
      - run: npm ci
      - name: Run all unit tests
        run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify layout and navigation across the eight existing browser profiles
        run: npx playwright test e2e/community-button-icons.spec.js --retries=0
      - name: Commit only verified changes and remove this one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learn.html assets/css/explore.css e2e/community-button-icons.spec.js
          git rm .github/workflows/verify-community-button-icons.yml
          git commit -m 'Add two matching icons to the Community topic button' -m 'Three identical decorative chat-heart icons now share the original size and interaction styling. Preserve the Community label, anchor destination, every other topic button and all other page content. A scoped wrapping rule accommodates narrow screens and enlarged text. Unit and browser tests passed before this commit.'
          git push origin HEAD:fix/community-button-icons-20261016
          echo "Verified commit: $(git rev-parse HEAD)"
          echo "Verified tree: $(git rev-parse HEAD^{tree})"
          git diff --stat 03b49f8052ef873b266db7b09f41d7feaea5bac0 HEAD
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: community-button-icons-proof
          path: |
            test-results/
            playwright-report/
          retention-days: 7
