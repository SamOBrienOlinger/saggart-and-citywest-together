name: Verify public gallery after preview confirmation
on:
  push:
    branches: [feat/ui-ux-refinements-20261014]
    paths: [.github/workflows/gallery-preview-check.yml]
permissions:
  contents: read
jobs:
  public-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Open the confirmation and verify the real served gallery
        shell: bash
        run: |
          mkdir -p public-gallery-proof
          node --input-type=module <<'JS'
          import { chromium, expect } from '@playwright/test';
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const originals = JSON.parse(await readFile('tests/fixtures/community-gallery.json', 'utf8')).images;
          const prefix = 'https://raw.githack.com/SamOBrienOlinger/saggart-and-citywest-together/';
          const candidates = [
            ['branch', prefix + 'feat/ui-ux-refinements-20261014/index.html'],
            ['exact-version', prefix + 'c323d6edc27893600672d9f46ec647a778b10a7a/index.html'],
          ];
          const records = [];
          const browser = await chromium.launch();
          for (const [name, url] of candidates) {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, reducedMotion: 'reduce' });
            const page = await context.newPage();
            const record = { name, url, verified: false, confirmation: false };
            try {
              let response = await page.goto(url, { waitUntil: 'load', timeout: 45000 });
              const confirm = page.getByRole('button', { name: 'Open the page', exact: true });
              if (await confirm.count()) {
                record.confirmation = true;
                [response] = await Promise.all([
                  page.waitForNavigation({ waitUntil: 'load', timeout: 45000 }),
                  confirm.tap(),
                ]);
              }
              record.status = response?.status();
              record.finalURL = page.url();
              record.headers = await response?.allHeaders();
              record.galleryItems = await page.locator('.community-slide').count();
              await writeFile(`public-gallery-proof/${name}.html`, await page.content());
              await expect(page.locator('.community-slide')).toHaveCount(21);
              await expect(page.locator('.carousel-controls')).toBeVisible();
              assert.deepEqual(await page.locator('.community-slide img').evaluateAll(images => images.map(image => image.getAttribute('src'))), originals.map(image => image.src));
              await expect(page.locator('.event-archive')).toHaveCount(0);
              await expect(page.locator('#local-services a[href="https://ipas.irishimmigration.ie/"]')).toHaveCount(0);
              record.thumbnailFraming = await page.locator('.carousel-thumb img').evaluateAll(images => images.map(image => getComputedStyle(image).objectFit));
              assert.deepEqual(record.thumbnailFraming, originals.map((_, index) => index < 18 ? 'cover' : 'contain'));
              record.imageHashes = [];
              for (const image of originals) {
                const reply = await context.request.get(new URL(image.src, page.url()).href, { timeout: 30000 });
                assert.equal(reply.status(), 200);
                const hash = createHash('sha256').update(await reply.body()).digest('hex');
                assert.equal(hash, image.sha256, image.src);
                record.imageHashes.push({ src: image.src, sha256: hash });
              }
              record.posters = [];
              for (const index of [6,7,8]) {
                await page.locator('.carousel-thumb').nth(index).tap();
                await expect(page.locator('[data-current]')).toHaveText(String(index + 1));
                const slide = page.locator('.community-slide').nth(index);
                await expect.poll(() => slide.locator('img').evaluate(image => image.complete && image.naturalWidth > 0)).toBe(true);
                await page.locator('.community-carousel').screenshot({ path: `public-gallery-proof/${name}-poster-${index+1}.png` });
                await slide.getByRole('button').tap();
                await expect(page.locator('.image-dialog')).toBeVisible();
                await expect(page.locator('.dialog-image')).toHaveAttribute('src', new URL(originals[index].src, page.url()).href);
                await page.locator('.dialog-close').tap();
                await expect(page.locator('.image-dialog')).not.toBeVisible();
                record.posters.push({ src: originals[index].src, selectedAndOpened: true });
              }
              record.verified = true;
            } catch (error) {
              record.error = String(error);
              record.visibleText = (await page.locator('body').innerText().catch(() => '')).slice(0,1500);
              await page.screenshot({ path: `public-gallery-proof/${name}-failure.png`, fullPage: true }).catch(() => {});
            } finally {
              records.push(record);
              await context.close();
            }
          }
          await browser.close();
          await writeFile('public-gallery-proof/report.json', JSON.stringify(records, null, 2));
          console.log(JSON.stringify(records.map(({imageHashes,...record}) => record), null, 2));
          assert.equal(records.find(record => record.name === 'exact-version')?.verified, true, 'The exact-version public preview must really render and open the unchanged posters');
          JS
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: public-gallery-after-confirmation
          path: public-gallery-proof/
          retention-days: 7
