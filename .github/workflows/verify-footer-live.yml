name: Verify published footer and preserved features
on:
  push:
    branches: [chore/verify-footer-release-20261015]
    paths: [.github/workflows/verify-footer-live.yml]
permissions:
  contents: read
jobs:
  live-footer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Check the actual published footer, its destinations and unchanged gallery
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { chromium, webkit, devices, request, expect } from '@playwright/test';
          import { readFile, writeFile, mkdir, readdir } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const base = 'https://samobrienolinger.github.io/saggart-and-citywest-together/';
          const baseline = '7b862c4bc9af862342afa3579df8e529da80f2b6';
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          const gallery = JSON.parse(await readFile('tests/fixtures/community-gallery.json', 'utf8')).images;
          const results = { base, release: '1b63cc45002df8e3a57f826f4ec23d20ff839ab2', files: [], profiles: [] };
          const out = 'live-footer-proof';
          await mkdir(out, { recursive: true });
          const client = await request.newContext();
          async function exactFile(file, suffix = '') {
            const expected = await readFile(file);
            let body;
            await expect.poll(async () => {
              const r = await client.get(base + file + suffix);
              body = await r.body();
              return r.status() === 200 ? hash(body) : String(r.status());
            }, { timeout: 180000, intervals: [1000, 3000, 5000], message: file + ' is the exact release' }).toBe(hash(expected));
            results.files.push({ path: file, exactRelease: true, sha256: hash(body) });
            return body;
          }
          try {
            await exactFile('assets/css/footer.css', '?v=20261015-footer-layout');
            for (const file of (await readdir('.')).filter(path => path.endsWith('.html'))) {
              const body = await exactFile(file);
              const original = execFileSync('git', ['show', baseline + ':' + file], { encoding: 'utf8' });
              const footer = html => html.match(/<footer\b[\s\S]*?<\/footer>/)?.[0];
              assert.equal(footer(body.toString()), footer(original), file + ' original footer markup');
              results.files.at(-1).originalFooterMarkup = true;
            }
            for (const file of ['assets/js/main.js', 'assets/js/ui-refinements.js', 'assets/js/community-carousel.js', 'assets/js/gallery.js', 'assets/js/translation.js', 'assets/css/branding.css', 'assets/css/buttons.css', 'assets/images/pride-logo.jpg', 'assets/images/facebook-qr-v3.jpeg']) await exactFile(file);
            for (const image of gallery) {
              const r = await client.get(base + image.src);
              assert.equal(r.status(), 200, image.src);
              assert.equal(hash(await r.body()), image.sha256, image.src);
            }
            results.originalGalleryImagesVerified = gallery.length;
            async function inspectFooter(page) {
              const footer = page.locator('.site-footer');
              await footer.scrollIntoViewIfNeeded();
              await expect.poll(() => footer.locator('img').evaluateAll(images => images.every(image => image.complete && image.naturalWidth > 0))).toBe(true);
              const issues = await footer.evaluate(root => {
                const viewport = document.documentElement.clientWidth;
                const anchors = [...root.querySelectorAll('a')].filter(a => a.getClientRects().length);
                const boxes = anchors.map(a => a.getBoundingClientRect());
                const issues = [];
                boxes.forEach((box, index) => {
                  if (box.left < -1 || box.right > viewport + 1 || box.height < 47 || box.width < 44) issues.push({ index, reason: 'target bounds' });
                  boxes.slice(0, index).forEach((other, j) => {
                    if (Math.min(box.right,other.right)-Math.max(box.left,other.left)>1 && Math.min(box.bottom,other.bottom)-Math.max(box.top,other.top)>1) issues.push({ index, j, reason: 'overlap' });
                  });
                });
                const logo = root.querySelector('.footer-logo');
                if (logo) {
                  const box = logo.getBoundingClientRect();
                  if (Math.abs(box.width-box.height) > .1 || getComputedStyle(logo).borderRadius !== '50%') issues.push({ reason: 'logo must stay circular' });
                }
                return issues;
              });
              assert.deepEqual(issues, []);
            }
            for (const [name, engine, config] of [
              ['desktop', chromium, { viewport: { width: 1440, height: 1000 } }],
              ['iphone-emulation', webkit, devices['iPhone 13']],
            ]) {
              const browser = await engine.launch();
              const context = await browser.newContext({ ...config, reducedMotion: 'reduce' });
              const page = await context.newPage();
              const record = { name, pages: [], posters: [], breakpoints: [] };
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              try {
                for (const path of ['index.html', 'contact.html', 'accessibility.html']) {
                  await page.goto(base + path);
                  await inspectFooter(page);
                  record.pages.push(path);
                  if (path === 'index.html') {
                    await page.locator('.site-footer').screenshot({ path: `${out}/${name}-footer.png`, animations: 'disabled' });
                    await page.locator('.site-footer .footer-grid li a').filter({ hasText: /^Facts$/ }).click();
                    await expect(page).toHaveURL(base + 'facts.html');
                    await expect(page.locator('.facts-resource > h3.resource-purpose')).toHaveCount(16);
                  }
                }
                await page.goto(base);
                await expect(page.locator('.community-slide')).toHaveCount(21);
                await expect(page.locator('#local-services .official-service-link')).toHaveCount(0);
                assert.deepEqual(await page.locator('.community-slide img').evaluateAll(images => images.map(image => image.getAttribute('src'))), gallery.map(image => image.src));
                for (const index of [6,7,8]) {
                  const thumbnail = page.locator('.carousel-thumb').nth(index);
                  if (config.hasTouch) await thumbnail.tap(); else await thumbnail.click();
                  await expect(page.locator('[data-current]')).toHaveText(String(index+1));
                  const opener = page.locator('.community-slide').nth(index).getByRole('button');
                  if (config.hasTouch) await opener.tap(); else await opener.click();
                  await expect(page.locator('.image-dialog')).toBeVisible();
                  await expect.poll(() => page.locator('.dialog-image').evaluate(img => img.complete && img.naturalWidth > 0)).toBe(true);
                  if (config.hasTouch) await page.locator('.dialog-close').tap(); else await page.locator('.dialog-close').click();
                  await expect(page.locator('.image-dialog')).not.toBeVisible();
                  record.posters.push(gallery[index].src);
                }
                for (const width of [320,390,704,1024,1100,1440]) {
                  await page.setViewportSize({ width, height: 1000 });
                  await page.goto(base);
                  await page.evaluate(() => { document.documentElement.style.fontSize='200%'; document.documentElement.dir='rtl'; });
                  await expect.poll(() => page.locator('.site-footer').evaluate(footer => parseFloat(getComputedStyle(footer).fontSize))).toBe(32);
                  await inspectFooter(page);
                  record.breakpoints.push({ width, textScale: 200, direction: 'rtl' });
                }
                assert.deepEqual(errors, []);
                record.javascriptErrors = errors;
                record.passed = true;
              } finally {
                results.profiles.push(record);
                await context.close();
                await browser.close();
              }
            }
            results.passed = true;
          } catch (error) {
            results.error = String(error);
            process.exitCode = 1;
          } finally {
            await client.dispose();
            await writeFile(`${out}/report.json`, JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
          }
          JS
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: published-footer-verification
          path: live-footer-proof/
          retention-days: 14
