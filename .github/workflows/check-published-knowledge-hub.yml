name: Verify published Knowledge Hub introduction
on:
  push:
    branches: [fix/knowledge-hub-introduction-20261016]
    paths: [.github/workflows/check-published-knowledge-hub.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6640813a7318a733ef989f06cddde5b413988e4e
          persist-credentials: false
      - name: Verify the actual published page matches the tested release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import URLError
          import hashlib, json, time
          url = 'https://samobrienolinger.github.io/saggart-and-citywest-together/facts.html'
          expected = Path('facts.html').read_bytes()
          actual = b''
          for attempt in range(12):
              try:
                  with urlopen(Request(url, headers={'Cache-Control': 'no-cache'}), timeout=10) as reply:
                      actual = reply.read()
                      status = reply.status
                  if actual == expected:
                      break
              except URLError as error:
                  print('Waiting for the published page:', error)
              time.sleep(5)
          assert actual == expected, 'The public page does not yet match the tested release'
          introduction = b'<p class="lede">Welcome to our Knowledge Hub. Here you will find reliable information about migration, our local area and the things we see online.</p>'
          heading = b'<p class="facts-hero-line">Explore evidence.<br>Ask better questions.<br>Find real answers.<br><span>Share with care.</span></p>'
          assert actual.count(introduction) == 1
          assert actual.count(heading) == 1
          assert b'Explore the evidence, ask better questions and share with care.' not in actual
          print(json.dumps({'url': url, 'status': status, 'release': '6640813a7318a733ef989f06cddde5b413988e4e', 'matches_tested_release': True, 'introduction_present_once': True, 'four_line_heading_preserved': True, 'sha256': hashlib.sha256(actual).hexdigest()}, indent=2))
          PY
