name: Verify footer Quiz label
on:
  push:
    branches: [fix/footer-quiz-label-20261016]
    paths: [.github/workflows/footer-quiz-label.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Change only existing footer labels and update their explicit fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib, json
          old = b'<a href="quiz.html">Take the quiz</a>'
          new = b'<a href="quiz.html">Quiz</a>'
          test_path = Path('tests/footer-preservation.test.js')
          fixture = test_path.read_text()
          paths = sorted(Path('.').glob('*.html'))
          assert len(paths) == 11
          records = []
          for path in paths:
              original = path.read_bytes()
              match = re.search(rb'<footer\b[\s\S]*?</footer>', original)
              assert match, path
              footer = match.group()
              expected = re.search(r"'" + re.escape(path.name) + r"': '([a-f0-9]{64})'", fixture).group(1)
              assert hashlib.sha256(footer).hexdigest() == expected, path
              if old not in footer:
                  assert b'Take the quiz' not in footer, path
                  records.append({'page':path.name,'unchanged':True,'reason':'No existing Take the quiz footer button'})
                  continue
              assert footer.count(old) == 1, path
              updated_footer = footer.replace(old, new, 1)
              updated = original[:match.start()] + updated_footer + original[match.end():]
              assert updated[:match.start()] == original[:match.start()]
              assert updated_footer.replace(new, old, 1) == footer
              path.write_bytes(updated)
              new_hash = hashlib.sha256(updated_footer).hexdigest()
              fixture = fixture.replace("'" + expected + "'", "'" + new_hash + "'", 1)
              records.append({'page':path.name,'label':'Quiz','href':'quiz.html','footer_only':True})
          assert any(record.get('footer_only') for record in records)
          fixture = fixture.replace('// Exact footer markup before the layout-only update, at release 7b862c4.', '// Expected footer markup, including the requested Quiz label change on 16 October 2026.')
          fixture = fixture.replace("    assert.ok(footer, path);", "    assert.ok(footer, path);\n    assert.ok(!footer.includes('Take the quiz'), path);\n    if (footer.includes('href=\"quiz.html\"')) assert.ok(footer.includes('<a href=\"quiz.html\">Quiz</a>'), path);")
          fixture = fixture.replace('footer layout update preserves every link, label, image and no-script route verbatim', 'footer retains the requested Quiz label and every other link, image and no-script route verbatim')
          test_path.write_text(fixture)
          print(json.dumps(records, indent=2))
          PY
          cat > e2e/footer-quiz-label.spec.js <<'JS'
          import { test, expect } from '@playwright/test';
          import { readdirSync, readFileSync } from 'node:fs';
          const pages = readdirSync('.').filter(name => name.endsWith('.html')).sort();
          test('existing footer quiz links use Quiz with unchanged destinations and styling', async ({ page }) => {
            for (const name of pages) {
              await page.goto('/' + name);
              const footer = readFileSync(name, 'utf8').match(/<footer\b[\s\S]*?<\/footer>/)[0];
              const expectedCount = footer.includes('<a href="quiz.html">Quiz</a>') ? 1 : 0;
              const link = page.locator('.site-footer a[href="quiz.html"]');
              await expect(link).toHaveCount(expectedCount);
              await expect(page.locator('#site-menu a[data-nav="quiz"]')).toHaveCount(1);
              if (!expectedCount) continue;
              await expect(link).toHaveText('Quiz');
              await expect(link).toHaveAccessibleName('Quiz');
              expect(await link.evaluate(el => {
                const style = getComputedStyle(el);
                const peer = getComputedStyle(document.querySelector('.site-footer a[href="facts.html"]'));
                return [style.backgroundColor, style.borderRadius, style.font].join('|') === [peer.backgroundColor, peer.borderRadius, peer.font].join('|');
              })).toBe(true);
            }
          });
          test('footer Quiz opens the working quiz with touch, click and keyboard', async ({ page, hasTouch }) => {
            await page.emulateMedia({ reducedMotion: 'reduce' });
            for (const method of ['pointer', 'keyboard']) {
              await page.goto('/index.html');
              const link = page.locator('.site-footer a[href="quiz.html"]');
              if (method === 'keyboard') await link.press('Enter');
              else if (hasTouch) await link.tap();
              else await link.click();
              await expect(page).toHaveURL(/\/quiz\.html$/);
              await expect(page.locator('#start-quiz')).toBeVisible();
              await page.locator('#start-quiz').click();
              await expect(page.locator('#question-panel')).toBeVisible();
            }
          });
          JS
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - name: Check footer and navbar on desktop and iPhone emulation
        run: npx playwright test e2e/footer-quiz-label.spec.js e2e/quiz-navigation.spec.js --project=chromium-desktop --project=webkit-iphone-emulation --retries=0
      - name: Commit verified changes on the feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' tests/footer-preservation.test.js e2e/footer-quiz-label.spec.js
          git rm .github/workflows/footer-quiz-label.yml
          git diff --cached --check
          git commit -m 'Rename existing footer Take the quiz buttons to Quiz' -m 'Change only the existing footer labels, preserving quiz.html destinations and all other content, styling, scripts and image files. Leave compact footers without a quiz button unchanged. Update exact footer fixtures for this intentional change and add focused regression coverage.'
          git push origin HEAD:fix/footer-quiz-label-20261016
          echo "Verified commit: $(git rev-parse HEAD)"
          echo "Verified tree: $(git rev-parse HEAD^{tree})"
          git diff --stat 0e08d1ead33aecbad65f6adc131eff8ebec8e192 HEAD
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: footer-quiz-label-checks
          path: |
            test-results/
            playwright-report/
          retention-days: 7
