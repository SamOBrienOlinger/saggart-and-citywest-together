name: Visual preview of PR 24
on:
  push:
    branches: [preview/render-pr24-6d65058]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6d65058f264a9de1a8bdb0bfff39493429736d3a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Open and render the public branch preview
        run: |
          mkdir -p public-preview-evidence
          node --input-type=module <<'NODE'
          import {chromium,devices} from '@playwright/test';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const commit='6d65058f264a9de1a8bdb0bfff39493429736d3a';
          const base=`https://rawcdn.githack.com/SamOBrienOlinger/saggart-and-citywest-together/${commit}/`;
          const report={commit,branch:'fix/browser-reflow-and-controls',preview:base+'index.html',profiles:[],confirmationScreens:0};
          const browser=await chromium.launch();
          try {
            const response=await fetch(base+'index.html',{signal:AbortSignal.timeout(20000)});
            report.homepageHTTPStatus=response.status;
            report.exactHomepageSource=(await response.text())===fs.readFileSync('index.html','utf8');
            assert.ok(response.ok&&report.exactHomepageSource);
            for(const [profile,options] of [['desktop',{viewport:{width:1440,height:900},deviceScaleFactor:1}],['mobile',{...devices['iPhone 13'],deviceScaleFactor:1}]]) {
              const context=await browser.newContext(options);
              const page=await context.newPage();
              const result={profile,viewport:page.viewportSize(),pages:[],scriptErrors:[]};
              report.profiles.push(result);
              page.on('pageerror',error=>result.scriptErrors.push(error.message));
              async function confirmHost() {
                const open=page.getByText('Open the page',{exact:true});
                if(await open.isVisible()) {
                  report.confirmationScreens++;
                  await open.click();
                  await page.waitForLoadState('networkidle');
                }
              }
              for(const path of ['index.html','facts.html','learn.html#heritage','quiz.html']) {
                await page.goto(base+path,{waitUntil:'networkidle',timeout:45000});
                await confirmHost();
                await page.locator('.site-header.nav-ready').waitFor({timeout:15000});
                const heading=await page.locator('h1').innerText();
                const style=await page.locator('.site-header').evaluate(el=>getComputedStyle(el).backgroundColor);
                assert.notEqual(style,'rgba(0, 0, 0, 0)');
                result.pages.push({path,url:page.url(),heading,headerStyle:style});
                if(path==='index.html') await page.screenshot({path:`public-preview-evidence/${profile}-public-home.png`,animations:'disabled'});
                if(path==='quiz.html') {
                  await page.locator('#start-quiz').click();
                  await page.locator('#answer-options button').first().waitFor();
                  result.quizStarts=true;
                }
              }
              assert.equal(result.scriptErrors.length,0);
              result.verified=true;
              await context.close();
            }
            report.browserVerified=true;
          } catch(error) {
            report.error=String(error);
            throw error;
          } finally {
            await browser.close();
            fs.writeFileSync('public-preview-evidence/verification.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr24-public-preview-verification
          path: public-preview-evidence/
          retention-days: 14
