name: Restore original gallery and event posters

on:
  push:
    branches: [feat/ui-ux-refinements-20261014]
    paths: [.github/workflows/restore-original-gallery.yml]

permissions:
  contents: write

jobs:
  restore-and-check:
    if: github.ref == 'refs/heads/feat/ui-ux-refinements-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore the original media without modifying any image files
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = '8ae10154906af05118a6d7baa6a64f585409015a'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, subprocess

          baseline = 'bdad1bf9bbe54a9c779d49590cd37a46e01ec1e4'
          original = subprocess.check_output(['git', 'show', baseline + ':index.html']).decode()
          start = '<div class="community-carousel"'
          end = '<div class="community-story"'
          def carousel(html):
              assert html.count(start) == 1 and html.count(end) == 1
              return html[html.index(start):html.index(end)]
          source_carousel = carousel(original)
          path = Path('index.html')
          before = path.read_text()
          assert len(re.findall(r'<figure class="community-slide"', before)) == 18
          restored = before.replace(carousel(before), source_carousel, 1)
          restored, count = re.subn(r'<section class="event-archive container"[\s\S]*?</section>\n', '', restored)
          assert count == 1, 'Expected exactly one separately added poster archive'
          assert 'Official IPAS website' not in restored
          assert 'href="https://ipas.irishimmigration.ie/"' not in restored
          assert '<span>Citywest IPAS supports</span></a>' in restored
          assert carousel(restored) == source_carousel
          path.write_text(restored)

          # A persistent manifest protects both the original ordering and bytes.
          slides = re.findall(r'<figure class="community-slide"[\s\S]*?</figure>', source_carousel)
          assert len(slides) == 21
          manifest = []
          for slide in slides:
              src = re.search(r'<img src="([^"]+)"', slide).group(1)
              original_bytes = subprocess.check_output(['git', 'show', baseline + ':' + src])
              assert Path(src).read_bytes() == original_bytes, src + ' differs from its original'
              manifest.append({'src': src, 'sha256': hashlib.sha256(original_bytes).hexdigest()})
          assert [m['src'].split('/')[-1] for m in manifest[6:9]] == [
              'potluck-poster.jpg', 'human-library-poster.jpg', 'village-clean-up-poster.jpg']
          fixture = Path('tests/fixtures/community-gallery.json')
          assert not fixture.exists()
          fixture.parent.mkdir(parents=True, exist_ok=True)
          fixture.write_text(json.dumps({'baseline': baseline, 'images': manifest}, indent=2) + '\n')

          path = Path('tests/ui-refinements.test.js')
          text = path.read_text()
          text = text.replace("import { readFileSync } from 'node:fs';", "import { readFileSync } from 'node:fs';\nimport { createHash } from 'node:crypto';")
          marker = "test('photo carousel has 18 photographs; three posters remain in the native archive disclosure'"
          assert text.count(marker) == 1
          text = text[:text.index(marker)] + r'''test('gallery preserves all 21 original images including event posters in their original order', () => {
            const html = read('index.html');
            const expected = JSON.parse(read('tests/fixtures/community-gallery.json')).images;
            const slides = html.match(/<figure class="community-slide"[\s\S]*?<\/figure>/g);
            const thumbnails = html.match(/<button class="carousel-thumb"[\s\S]*?<\/button>/g);
            assert.equal(slides.length, 21);
            assert.equal(thumbnails.length, 21);
            assert.equal(expected.length, 21);
            assert.deepEqual(slides.map(slide => slide.match(/<img src="([^"]+)"/)[1]), expected.map(image => image.src));
            slides.forEach((slide, i) => {
              assert.ok(slide.includes(`data-image-index="${i}"`));
              assert.ok(slide.includes(`aria-label="${i + 1} of 21"`));
              assert.ok(thumbnails[i].includes(`data-slide="${i}"`));
              assert.ok(thumbnails[i].includes(`src="${expected[i].src}"`));
              assert.doesNotMatch(slide, /<figcaption/);
              const bytes = readFileSync(new URL('../' + expected[i].src, import.meta.url));
              assert.equal(createHash('sha256').update(bytes).digest('hex'), expected[i].sha256, expected[i].src);
            });
            assert.deepEqual(expected.slice(6, 9).map(image => image.src.split('/').pop()), [
              'potluck-poster.jpg', 'human-library-poster.jpg', 'village-clean-up-poster.jpg',
            ]);
            assert.doesNotMatch(html, /class="event-archive|class="event-posters|class="event-poster-grid/);
          });
          '''
          path.write_text(text)

          path = Path('e2e/site.spec.js')
          text = path.read_text()
          for old, new, expected_count in [
              ('toHaveCount(18)', 'toHaveCount(21)', 1),
              ('index < 18', 'index < 21', 1),
              ("toHaveText('18')", "toHaveText('21')", 2),
          ]:
              assert text.count(old) == expected_count, old
              text = text.replace(old, new)
          path.write_text(text)

          path = Path('e2e/ui-refinements.spec.js')
          text = path.read_text()
          helper = r'''
          // Original event posters remain slides 7-9, not a separate disclosure.
          async function checkGalleryPosters(page, hasTouch, scripts = true) {
            const files = ['potluck-poster.jpg', 'human-library-poster.jpg', 'village-clean-up-poster.jpg'];
            await expect(page.locator('.community-slide')).toHaveCount(21);
            await expect(page.locator('.event-archive')).toHaveCount(0);
            for (let i = 0; i < files.length; i++) {
              const slide = page.locator('.community-slide').nth(i + 6);
              if (scripts) {
                const thumbnail = page.locator('.carousel-thumb').nth(i + 6);
                if (hasTouch) await thumbnail.tap();
                else await thumbnail.click();
                await expect(page.locator('[data-current]')).toHaveText(String(i + 7));
                await expect(slide).toHaveAttribute('aria-hidden', 'false');
              } else {
                // Scroll the real, native no-script rail; do not change the slide state.
                await slide.evaluate(el => el.scrollIntoView({ block: 'center', inline: 'center', behavior: 'instant' }));
              }
              const image = slide.locator('img');
              await expect(image).toHaveAttribute('src', 'assets/images/community/' + files[i]);
              await expect(image).toBeInViewport();
              await expect.poll(() => image.evaluate(img => img.complete && img.naturalWidth > 0)).toBe(true);
              if (scripts) {
                const open = slide.getByRole('button');
                if (hasTouch) await open.tap();
                else await open.click();
                await expect(page.locator('.image-dialog')).toBeVisible();
                await expect(page.locator('.dialog-image')).toHaveAttribute('src', new RegExp(files[i].replaceAll('.', '\\.') + '$'));
                await expect.poll(() => page.locator('.dialog-image').evaluate(img => img.complete && img.naturalWidth > 0)).toBe(true);
                if (hasTouch) await page.locator('.dialog-close').tap();
                else await page.locator('.dialog-close').click();
                await expect(page.locator('.image-dialog')).not.toBeVisible();
                await expect(open).toBeFocused();
              }
            }
          }
          '''
          marker = "const email = 'saggartcitywesttogether@gmail.com';"
          assert text.count(marker) == 1
          text = text.replace(marker, marker + '\n' + helper, 1)
          old_title = "test('task links, Facts order and poster archive are usable with enlarged text and RTL', async ({ page }, info) => {"
          new_title = "test('task links, Facts order and original gallery posters are usable with enlarged text and RTL', async ({ page, hasTouch }, info) => {"
          assert old_title in text
          text = text.replace(old_title, new_title, 1)
          begin = "  await expect(page.locator('.event-poster-grid')).not.toBeVisible();"
          finish = "  await info.attach('Archived posters, enlarged RTL', { body: await page.locator('.event-archive').screenshot(), contentType: 'image/png' });"
          assert text.count(begin) == 1 and text.count(finish) == 1
          replacement = "  await page.evaluate(() => { document.documentElement.dir = 'rtl'; document.documentElement.style.fontSize = '200%'; });\n  await checkGalleryPosters(page, hasTouch);\n  await expectTextReflow(page, expect, 'original gallery posters in RTL at 200% text');\n  await info.attach('Original gallery posters, enlarged RTL', { body: await page.locator('.community-carousel').screenshot(), contentType: 'image/png' });"
          text = text[:text.index(begin)] + replacement + text[text.index(finish) + len(finish):]
          old_title = "test('contact, task shortcuts, Facts and poster disclosure remain available', async ({ page }) => {"
          new_title = "test('contact, task shortcuts, Facts and gallery posters remain available', async ({ page, hasTouch }) => {"
          assert old_title in text
          text = text.replace(old_title, new_title, 1)
          old = "    await page.locator('.event-posters > summary').click();\n    await expect(page.locator('.event-poster-grid')).toBeVisible();"
          assert text.count(old) == 1
          text = text.replace(old, "    await page.emulateMedia({ reducedMotion: 'reduce' });\n    await expect(page.locator('.carousel-controls')).toBeHidden();\n    await checkGalleryPosters(page, hasTouch, false);", 1)
          path.write_text(text)

          path = Path('docs/ui-ux-refinements.md')
          text = path.read_text()
          old = '- The image-only carousel contains 18 photographs;'
          lines = text.splitlines()
          assert sum(line.startswith(old) for line in lines) == 1
          lines = [('- The gallery retains all 21 original items, in their original order: 18 photographs and the three event posters. The entire carousel markup is restored from the original main-branch baseline. The separate poster archive is removed. No image files are edited, cropped, replaced or regenerated, and no text overlays are added. A regression fixture verifies image order and SHA-256 hashes. Thumbnails and full-image views retain the existing responsive presentation.') if line.startswith(old) else line for line in lines]
          text = '\n'.join(lines) + '\n'
          text = text.replace('a separately named “Official IPAS website” link remains available.', 'the separate “Official IPAS website” link was removed at the user’s request.')
          text = text.replace('the expanded archive at enlarged text/RTL', 'the original posters within the gallery at enlarged text/RTL')
          text = text.replace('Existing carousel expectations are updated to 18 photos without dropping image loading, wrapping, keyboard or dialog tests.', 'Carousel expectations cover all 21 original items, including poster loading, wrapping, keyboard/touch input, full-image dialogs and no-JavaScript access.')
          path.write_text(text)

          assert not subprocess.check_output(['git', 'diff', '--name-only', '--', 'assets/images', 'assets/js', 'learn.html']).strip()
          print('Restored the exact original carousel: 21 images, including all three event posters, in original order. All image bytes unchanged.')
          PY
      - run: npm ci
      - name: Unit and image-integrity checks
        run: npm test
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify galleries, posters, responsive layouts and no-script access
        run: |
          npm run test:browser -- e2e/site.spec.js e2e/ui-refinements.spec.js --grep 'approved homepage|all carousel media|history combines|saved gallery links|enlarged text|essential navigation|gallery posters' --workers=2
      - name: Commit only the verified restoration to the preview branch
        shell: bash
        run: |
          git fetch origin feat/ui-ux-refinements-20261014
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-original-gallery.yml
          git add index.html e2e/site.spec.js e2e/ui-refinements.spec.js tests/ui-refinements.test.js tests/fixtures/community-gallery.json docs/ui-ux-refinements.md
          git diff --cached --stat
          git commit -m 'fix: keep all original gallery images and event posters'
          git push origin HEAD:refs/heads/feat/ui-ux-refinements-20261014
          echo "Verified restoration commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-gallery-restoration-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
