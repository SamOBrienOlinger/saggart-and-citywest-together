name: Verify published footer Quiz labels
on:
  push:
    branches: [fix/footer-quiz-label-20261016]
    paths: [.github/workflows/check-published-footer-quiz.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa5d126a4290af60cf5aa1375cd390d04b114be9
          persist-credentials: false
      - name: Confirm actual published pages match the tested release
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from concurrent.futures import ThreadPoolExecutor
          import re, json, time, hashlib
          base = 'https://samobrienolinger.github.io/saggart-and-citywest-together/'
          def check(path):
              expected = path.read_bytes()
              for attempt in range(12):
                  with urlopen(Request(base + path.name, headers={'Cache-Control':'no-cache'}), timeout=20) as reply:
                      actual = reply.read()
                      status = reply.status
                  if actual == expected: break
                  time.sleep(5)
              assert actual == expected, path.name
              footer = re.search(rb'<footer\b[\s\S]*?</footer>', actual).group()
              assert b'Take the quiz' not in footer, path.name
              count = footer.count(b'<a href="quiz.html">Quiz</a>')
              assert count == (0 if path.name == '404.html' else 1), path.name
              return {'page':path.name,'http_status':status,'matches_release':True,'footer_quiz_buttons':count,'sha256':hashlib.sha256(actual).hexdigest()}
          with ThreadPoolExecutor(max_workers=4) as pool:
              records = list(pool.map(check, sorted(Path('.').glob('*.html'))))
          assert len(records) == 11
          assert sum(r['footer_quiz_buttons'] for r in records) == 10
          print(json.dumps({'release':'fa5d126a4290af60cf5aa1375cd390d04b114be9','verified':True,'pages':records}, indent=2))
          PY
