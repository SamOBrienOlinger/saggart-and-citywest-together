name: Verify published website clearance
on:
  push:
    branches: [verify/published-clearance-20261017]
permissions:
  contents: read
jobs:
  published-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify live HTML and assets byte for byte
        run: |
          mkdir -p published-evidence
          python3 - <<'PY'
          import pathlib, subprocess, hashlib, json, urllib.request, urllib.parse
          from concurrent.futures import ThreadPoolExecutor
          base = 'https://samobrienolinger.github.io/saggart-and-citywest-together/'
          paths = [p for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p and (p.endswith('.html') or p.startswith('assets/'))]
          def verify(path):
              expected = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              url = base + urllib.parse.quote(path) + '?clearance=79f8a2b-d0f7308'
              try:
                  req = urllib.request.Request(url,headers={'User-Agent':'SCT-release-verification','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=30) as response:
                      actual = hashlib.sha256(response.read()).hexdigest()
                      return {'path':path,'status':response.status,'expected':expected,'actual':actual,'match':actual == expected}
              except Exception as error:
                  return {'path':path,'expected':expected,'match':False,'error':str(error)}
          with ThreadPoolExecutor(max_workers=4) as pool: records = list(pool.map(verify,paths))
          pathlib.Path('published-evidence/live-file-hashes.json').write_text(json.dumps(records,indent=2))
          failures = [r for r in records if not r['match']]
          print(json.dumps({'checked':len(records),'matched':len(records)-len(failures),'failures':failures},indent=2))
          assert not failures, 'Published file mismatch or unavailable resource'
          PY
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Open every public page on desktop and mobile
        run: |
          node --input-type=module <<'NODE'
          import { chromium, expect } from '@playwright/test';
          import fs from 'node:fs';
          const base='https://samobrienolinger.github.io/saggart-and-citywest-together/';
          const paths=fs.readdirSync('.').filter(p=>p.endsWith('.html')).sort();
          const browser=await chromium.launch();
          const reports=[];
          try {
            for (const width of [390,1440]) {
              const context=await browser.newContext({viewport:{width,height:900},reducedMotion:'no-preference'});
              for (const path of paths) {
                const page=await context.newPage();
                const errors=[];page.on('pageerror',e=>errors.push(e.message));
                try {
                  const response=await page.goto(base+path,{waitUntil:'load'});
                  expect(response?.status()).toBe(200);
                  if(path==='gallery.html') await expect(page).toHaveURL(/learn\.html#heritage$/);
                  await expect(page.locator('.site-header')).toHaveClass(/nav-ready/);
                  await expect(page.locator('h1')).toBeVisible();
                  await page.locator('img[src]').evaluateAll(images=>images.forEach(img=>img.loading='eager'));
                  await expect.poll(()=>page.locator('img[src]').evaluateAll(images=>images.every(img=>img.complete&&img.naturalWidth>0))).toBe(true);
                  if(path==='about.html') {
                    await expect(page.locator('body')).toHaveClass(/about-reveal-ready/);
                    const cards=page.locator('.about-content>.about-section');
                    await expect(cards).toHaveCount(7);
                    for(const card of await cards.all()) {
                      await card.evaluate(el=>el.scrollIntoView({block:'start',behavior:'instant'}));
                      await expect(card).toHaveCSS('opacity','1');
                      await expect(card).toHaveClass(/about-reveal-visible/);
                    }
                    await page.evaluate(()=>scrollTo({top:0,behavior:'instant'}));
                    await page.screenshot({path:`published-evidence/about-${width}.png`,fullPage:true});
                  }
                  expect(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth)).toBeLessThanOrEqual(1);
                  expect(errors).toEqual([]);
                  reports.push({width,path,url:page.url(),status:'passed',imageCount:await page.locator('img[src]').count()});
                } catch(error) {
                  reports.push({width,path,status:'failed',error:String(error),scriptErrors:errors});
                  await page.screenshot({path:`published-evidence/failure-${width}-${path}.png`,fullPage:true}).catch(()=>{});
                  throw error;
                } finally {await page.close();}
              }
              await context.close();
            }
          } finally {
            fs.writeFileSync('published-evidence/live-browser-results.json',JSON.stringify(reports,null,2));
            console.log(JSON.stringify(reports,null,2));
            await browser.close();
          }
          NODE
      - name: Preserve public-site evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: published-website-clearance
          path: published-evidence/
          retention-days: 14
