name: Verify footer layout without changing features
on:
  push:
    branches: [fix/footer-layout-20261015]
    paths:
      - assets/css/footer.css
      - e2e/footer-layout.spec.js
      - e2e/footer.spec.js
      - tests/footer-preservation.test.js
      - .github/workflows/footer-layout-check.yml
permissions:
  contents: write
concurrency:
  group: footer-layout-review
  cancel-in-progress: true
jobs:
  verify-footer:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh only the footer stylesheet version on all eleven pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, json
          baseline = '7b862c4bc9af862342afa3579df8e529da80f2b6'
          pages = sorted(Path('.').glob('*.html'))
          assert len(pages) == 11
          records = []
          for path in pages:
              original = subprocess.check_output(['git', 'show', baseline + ':' + str(path)])
              current = path.read_bytes()
              old = b'assets/css/footer.css?v=20261013-footer'
              new = b'assets/css/footer.css?v=20261015-footer-layout'
              assert current.replace(new, old) == original, str(path) + ': unexpected HTML change'
              assert current.count(old) + current.count(new) == 1, str(path)
              updated = current.replace(old, new)
              path.write_bytes(updated)
              assert updated.replace(new, old) == original
              records.append({'page': str(path), 'footer_markup_unchanged': True, 'only_change': 'footer stylesheet cache key'})
          subprocess.run(['git', 'diff', '--exit-code', baseline, '--', 'assets/images', 'assets/icons', 'assets/js', 'assets/css/branding.css', 'assets/css/buttons.css'], check=True)
          Path('footer-proof').mkdir(exist_ok=True)
          Path('footer-proof/integrity.json').write_text(json.dumps(records, indent=2))
          PY
      - run: npm ci
      - name: Unit, footer-content and original-image integrity tests
        run: npm test | tee footer-proof/unit-tests.txt
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify footer, circular branding and preserved gallery across all eight profiles
        run: npx playwright test e2e/footer-layout.spec.js e2e/footer.spec.js e2e/branding.spec.js e2e/gallery-display-preservation.spec.js --retries=0
      - name: Commit only the cache keys and remove this one-off verifier
        shell: bash
        env:
          BRANCH: fix/footer-layout-20261015
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          git rm .github/workflows/footer-layout-check.yml
          git commit -m 'Refresh the verified footer stylesheet on every page and remove the one-off verifier'
          git push origin "HEAD:$BRANCH"
          git rev-parse HEAD > footer-proof/verified-head.txt
      - name: Preserve test results and actual browser screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: footer-layout-proof
          path: |
            footer-proof/
            test-results/
            playwright-report/
          retention-days: 14
