name: Verify feature release on the production website
on:
  push:
    branches: [chore/verify-feature-deployment-20261015]
    paths: [.github/workflows/verify-feature-production.yml]
permissions:
  contents: read
jobs:
  verify-live-site:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 860b5c7c092c374721b476233757e66be192005e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify the actual published pages and original gallery files
        shell: bash
        run: |
          mkdir -p live-release-proof
          node --input-type=module <<'JS'
          import { chromium, webkit, devices, expect, request } from '@playwright/test';
          import { readFile, writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          import { activateHistoryLink } from './e2e/history-link-actions.mjs';
          const base = 'https://samobrienolinger.github.io/saggart-and-citywest-together/';
          const report = { base, expectedBranchCommit: '860b5c7c092c374721b476233757e66be192005e', started: new Date().toISOString(), files: [], galleryImages: [], browsers: [] };
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const originals = JSON.parse(await readFile('tests/fixtures/community-gallery.json', 'utf8')).images;
          const api = await request.newContext({ timeout: 30000 });
          const homepageHash = digest(await readFile('index.html'));
          try {
            // Poll publication only. User interactions below are not retried.
            await expect.poll(async () => {
              const response = await api.get(base);
              return response.status() === 200 ? digest(await response.body()) : 'HTTP ' + response.status();
            }, { message: 'production homepage has the exact requested feature content', timeout: 600000, intervals: [5000,10000] }).toBe(homepageHash);
            const paths = execFileSync('git', ['ls-files'], { encoding: 'utf8' }).trim().split('\n')
              .filter(path => /^[^/]+\.html$/.test(path) || /^assets\/(css|js)\/.*\.(css|js)$/.test(path));
            const checkPath = async path => {
              const expected = digest(await readFile(path));
              let response;
              await expect.poll(async () => {
                response = await api.get(new URL(path, base).href);
                return response.status() === 200 ? digest(await response.body()) : 'HTTP ' + response.status();
              }, { message: 'published bytes match the release: ' + path, timeout: 120000, intervals: [3000,5000] }).toBe(expected);
              report.files.push({ path, status: response.status(), sha256: expected });
            };
            for (let i = 0; i < paths.length; i += 6) await Promise.all(paths.slice(i, i + 6).map(checkPath));
            for (const image of originals) {
              const response = await api.get(new URL(image.src, base).href);
              assert.equal(response.status(), 200, image.src);
              const actual = digest(await response.body());
              assert.equal(actual, image.sha256, 'Original image bytes: ' + image.src);
              report.galleryImages.push({ src: image.src, sha256: actual });
            }
            for (const [name, engine, settings] of [
              ['desktop', chromium, { viewport: { width: 1440, height: 1000 } }],
              ['iphone-emulation', webkit, devices['iPhone 13']],
            ]) {
              const browser = await engine.launch();
              const context = await browser.newContext({ ...settings, reducedMotion: 'reduce' });
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              const result = { name, posters: [], checks: [] };
              const activate = async locator => settings.hasTouch ? locator.tap() : locator.click();
              try {
                const response = await page.goto(base, { waitUntil: 'load', timeout: 45000 });
                assert.equal(response.status(), 200);
                await expect(page.locator('.carousel-controls')).toBeVisible();
                await expect(page.locator('.community-slide')).toHaveCount(21);
                await expect(page.locator('.event-archive')).toHaveCount(0);
                assert.deepEqual(await page.locator('.community-slide img').evaluateAll(images => images.map(image => image.getAttribute('src'))), originals.map(image => image.src));
                assert.deepEqual(await page.locator('.carousel-thumb img').evaluateAll(images => images.map(image => getComputedStyle(image).objectFit)), originals.map((_, index) => index < 18 ? 'cover' : 'contain'));
                await expect(page.locator('#local-services a[href="https://ipas.irishimmigration.ie/"]')).toHaveCount(0);
                await expect(page.locator('#local-services').getByRole('link', { name: 'Citywest IPAS supports', exact: true })).toHaveAttribute('href', 'citywest-supports.html');
                for (let index = 0; index < 21; index++) {
                  await activate(page.locator('.carousel-thumb').nth(index));
                  await expect(page.locator('[data-current]')).toHaveText(String(index + 1));
                  const slide = page.locator('.community-slide').nth(index);
                  await expect(slide).toHaveAttribute('aria-hidden', 'false');
                  await expect.poll(() => slide.locator('img').evaluate(image => image.complete && image.naturalWidth > 0)).toBe(true);
                  if ([6,7,8].includes(index)) {
                    await page.locator('.community-carousel').screenshot({ path: `live-release-proof/${name}-poster-${index + 1}.png` });
                    await activate(slide.getByRole('button'));
                    await expect(page.locator('.image-dialog')).toBeVisible();
                    await expect(page.locator('.dialog-image')).toHaveAttribute('src', new URL(originals[index].src, base).href);
                    await expect.poll(() => page.locator('.dialog-image').evaluate(image => image.complete && image.naturalWidth > 0)).toBe(true);
                    await activate(page.locator('.dialog-close'));
                    await expect(page.locator('.image-dialog')).not.toBeVisible();
                    result.posters.push({ index: index + 1, src: originals[index].src, selectedAndOpened: true });
                  }
                }
                await activate(page.locator('[data-next]'));
                await expect(page.locator('[data-current]')).toHaveText('1');
                result.checks.push('All 21 images load in the original order, original thumbnail framing, all three posters open, wrap-around, correct local supports destination, removed homepage external IPAS link');
                const cta = page.locator('.community-actions > .pill-button');
                const alignment = await cta.evaluate(button => {
                  const rect = button.getBoundingClientRect();
                  const parent = button.parentElement.getBoundingClientRect();
                  return { difference: Math.abs(rect.x + rect.width / 2 - parent.x - parent.width / 2), width: rect.width, height: rect.height };
                });
                assert.ok(alignment.difference < 2, 'Centred Get involved');
                assert.ok(alignment.height >= 48, 'Touch target');
                await expect(cta).toHaveAttribute('href', 'contact.html#contact-details');
                await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));
                await page.screenshot({ path: `live-release-proof/${name}-homepage.png`, fullPage: true });
                await page.goto(new URL('contact.html', base).href, { waitUntil: 'load' });
                await expect(page.getByRole('heading', { level: 1 })).toHaveText('Contact us and get involved');
                await expect(page.locator('#copy-email')).toBeVisible();
                await expect(page.locator('#contact-email')).toHaveAttribute('href', 'mailto:saggartcitywesttogether@gmail.com');
                await page.goto(new URL('citywest-supports.html', base).href, { waitUntil: 'load' });
                await expect(page.getByRole('heading', { level: 1 })).toHaveText('Citywest IPAS supports');
                await page.goto(new URL('facts.html', base).href, { waitUntil: 'load' });
                await expect(page.locator('.facts-resource > h3.resource-purpose')).toHaveCount(16);
                result.checks.push('Centred Get involved, shorter page headings, copy-email availability, 16 task-first Facts resources');
                await page.goto(new URL('learn.html#heritage', base).href, { waitUntil: 'load' });
                await activateHistoryLink(page.getByRole('link', { name: 'Read the local stories', exact: true }), !!settings.hasTouch);
                await expect(page).toHaveURL(/#history-stories$/);
                await activateHistoryLink(page.getByRole('link', { name: 'See the mill photograph', exact: true }), !!settings.hasTouch);
                await expect(page).toHaveURL(/#photo-mill$/);
                await expect(page.locator('#photo-mill')).toBeVisible();
                await expect(page.locator('[data-gallery-count]')).toHaveText('3 / 6');
                result.checks.push('Actual live history links select the mill photograph');
                assert.deepEqual(errors, [], 'No application JavaScript errors');
                result.passed = true;
              } catch (error) {
                result.error = String(error);
                result.passed = false;
                await page.screenshot({ path: `live-release-proof/${name}-failure.png`, fullPage: true }).catch(() => {});
                throw error;
              } finally {
                report.browsers.push(result);
                await browser.close();
              }
            }
            report.passed = true;
          } catch (error) {
            report.passed = false;
            report.error = String(error);
            process.exitCode = 1;
          } finally {
            report.finished = new Date().toISOString();
            await writeFile('live-release-proof/report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            await api.dispose();
          }
          JS
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: live-feature-release-proof
          path: live-release-proof/
          retention-days: 14
