name: Verify published Community icons
on:
  push:
    branches: [fix/community-button-icons-20261016]
    paths: [.github/workflows/verify-live-community-icons.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9328547b8eb9f949c00a47e2c0bd7bb6d30aabcc
          persist-credentials: false
      - name: Verify public HTML, responsive stylesheet and original SVG
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from html.parser import HTMLParser
          import hashlib, json, time
          base = 'https://samobrienolinger.github.io/saggart-and-citywest-together/'
          files = [('learn.html', 'learn.html'), ('assets/css/explore.css', 'assets/css/explore.css?v=community-icons-20261016'), ('assets/icons/chat-heart.svg', 'assets/icons/chat-heart.svg')]
          records = []
          for path, address in files:
              expected = Path(path).read_bytes()
              for attempt in range(6):
                  with urlopen(Request(base + address, headers={'Cache-Control':'no-cache'}), timeout=20) as reply:
                      actual = reply.read()
                      status = reply.status
                  if actual == expected:
                      break
                  time.sleep(5)
              assert actual == expected, f'Published file does not match release: {path}'
              records.append({'url':base + address, 'status':status, 'matches_release':True, 'sha256':hashlib.sha256(actual).hexdigest()})
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active = False; self.images = []; self.text = []; self.hidden_group = False; self.href = None
              def handle_starttag(self, tag, pairs):
                  a = dict(pairs)
                  if tag == 'a' and 'explore-topic--community' in a.get('class','').split():
                      self.active = True; self.href = a.get('href')
                  if self.active and tag == 'img': self.images.append(a)
                  if self.active and tag == 'span' and a.get('class') == 'explore-community-icons': self.hidden_group = a.get('aria-hidden') == 'true'
              def handle_endtag(self, tag):
                  if tag == 'a': self.active = False
              def handle_data(self, value):
                  if self.active: self.text.append(value)
          check = Check(); check.feed(Path('learn.html').read_text())
          assert check.href == '#community'
          assert ''.join(check.text).strip() == 'Community'
          assert check.hidden_group
          assert len(check.images) == 3
          assert all(image.get('src') == 'assets/icons/chat-heart.svg' and image.get('alt') == '' for image in check.images)
          assert check.images[0] == check.images[1] == check.images[2]
          print(json.dumps({'release':'9328547b8eb9f949c00a47e2c0bd7bb6d30aabcc','verified':True,'matching_original_icons':3,'label':'Community','destination':'#community','files':records}, indent=2))
          PY
