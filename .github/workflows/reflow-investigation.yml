name: Verify minimal regression correction
on:
  push:
    branches: [fix/browser-reflow-and-controls]
permissions:
  contents: write
jobs:
  correct:
    if: github.ref == 'refs/heads/fix/browser-reflow-and-controls'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/browser-reflow-and-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Preserve every unrelated test byte
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          base = '6640813a7318a733ef989f06cddde5b413988e4e'
          original = subprocess.check_output(['git', 'show', base + ':e2e/site.spec.js']).decode()
          old = "  expect(await page.locator('#local-services').evaluate(el => !!(el.compareDocumentPosition(document.querySelector('.community-section')) & Node.DOCUMENT_POSITION_FOLLOWING))).toBe(true);"
          new = "  // The approved homepage places the community gallery before local services.\n  await expect(page.locator('.community-section')).toBeVisible();\n  await expect(page.locator('#local-services')).toBeVisible();\n" + old.replace('DOCUMENT_POSITION_FOLLOWING', 'DOCUMENT_POSITION_PRECEDING')
          assert original.count(old) == 1, 'Expected exactly one obsolete order assertion'
          updated = original.replace(old, new)
          assert updated.replace(new, old) == original, 'Unrelated test content changed'
          Path('e2e/site.spec.js').write_text(updated)
          PY
          node --check e2e/site.spec.js
          node --check e2e/button-appearance.mjs
          git diff --check
      - run: npm ci
      - run: npm test
      - name: Commit verified test correction on the isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/site.spec.js
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve all original tests while correcting approved homepage order'
            git push origin HEAD:fix/browser-reflow-and-controls
          fi
          git rev-parse HEAD
          git diff 6640813a7318a733ef989f06cddde5b413988e4e -- e2e/site.spec.js e2e/button-appearance.mjs
