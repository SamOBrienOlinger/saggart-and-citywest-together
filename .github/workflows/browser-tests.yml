name: Cross-browser regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium and Android emulation
            os: ubuntu-latest
            browser: chromium
            evidence: chromium
            projects: --project=chromium-desktop --project=chromium-android-emulation
          - name: Firefox
            os: ubuntu-latest
            browser: firefox
            evidence: firefox
            projects: --project=firefox-desktop
          - name: WebKit desktop on macOS
            os: macos-15
            browser: webkit
            evidence: webkit-desktop
            projects: --project=webkit-desktop
          - name: WebKit iPhone emulation
            os: macos-15
            browser: webkit
            evidence: webkit-iphone
            projects: --project=webkit-iphone-emulation
          - name: WebKit iPad emulation
            os: macos-15
            browser: webkit
            evidence: webkit-ipad
            projects: --project=webkit-ipad-emulation
          - name: WebKit 320px mobile viewport
            os: macos-15
            browser: webkit
            evidence: webkit-narrow
            projects: --project=webkit-narrow
          - name: WebKit landscape iPhone emulation
            os: macos-15
            browser: webkit
            evidence: webkit-landscape
            projects: --project=webkit-landscape
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install test browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser regression suite
        run: npm run test:browser -- ${{ matrix.projects }}
      - name: Preserve reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.evidence }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  safari:
    name: Actual desktop Safari on macOS
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enable Safari automation on the disposable runner
        run: sudo safaridriver --enable
      - name: Run desktop Safari checks
        run: |
          python3 scripts/serve-test-site.py > /tmp/sact-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node e2e/safari-smoke.mjs
      - name: Preserve Safari evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-safari
          path: safari-results/
          retention-days: 14
  webkit-summary:
    name: WebKit on macOS and mobile emulation
    needs: playwright
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser profile to pass
        env:
          MATRIX_RESULT: ${{ needs.playwright.result }}
        run: test "$MATRIX_RESULT" = success
