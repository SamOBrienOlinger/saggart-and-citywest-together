name: Verify community quiz topics
on:
  push:
    branches: [feat/quiz-community-topics-20261016]
    paths: [.github/workflows/verify-quiz-topics.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Version the revised bank and describe its subject matter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/js/quiz.js');s=p.read_text()
          old="../data/questions.js'";new="../data/questions.js?v=topics-20261016'"
          assert s.count(old)==1
          s=s.replace(old,new,1);p.write_text(s)
          p=Path('quiz.html');s=p.read_text()
          edits=[
            ('assets/js/quiz.js?v=confetti-20261016','assets/js/quiz.js?v=confetti-20261016-topics'),
            ('<h2>How the quiz works</h2><ul class="check-list">','<h2>How the quiz works</h2><p>Questions cover Saggart and Citywest, local services, migration facts, IPAS, human rights and community contributions.</p><ul class="check-list">'),
          ]
          for old,new in edits:
            assert s.count(old)==1,old
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff -- assets/js/quiz.js quiz.html > integration.diff
      - run: npm ci
      - name: Run all unit tests
        run: npm test | tee unit-tests.log
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Exercise every question and all existing confetti boundaries in eight profiles
        run: |
          npx playwright test e2e/quiz-topics.spec.js e2e/quiz-confetti.spec.js --retries=0
          mkdir -p topics-proof
          cp -r test-results playwright-report topics-proof/
      - name: Check the original complete quiz and restart journey
        run: |
          npx playwright test e2e/site.spec.js --grep 'complete shuffled quiz scores correctly and restarts' --retries=0
          mkdir -p original-quiz-proof
          cp -r test-results playwright-report original-quiz-proof/
      - name: Commit tested integration and remove the one-off verifier
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/js/quiz.js quiz.html
          git rm .github/workflows/verify-quiz-topics.yml
          git commit -m 'Integrate tested community quiz topics and remove one-off verifier'
          git push origin HEAD:feat/quiz-community-topics-20261016
          git rev-parse HEAD > verified-commit.txt
          git rev-parse HEAD^{tree} > verified-tree.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: community-quiz-topics-proof
          path: |
            topics-proof/
            original-quiz-proof/
            test-results/
            playwright-report/
            unit-tests.log
            integration.diff
            verified-commit.txt
            verified-tree.txt
          retention-days: 7
