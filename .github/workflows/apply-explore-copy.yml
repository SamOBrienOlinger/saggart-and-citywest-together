name: Apply and verify requested Explore page copy
on:
  push:
    branches: [fix/explore-copy-20261016]
    paths: [.github/workflows/apply-explore-copy.yml]
permissions:
  contents: write
jobs:
  edit-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/explore-copy-20261016
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact requested replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, re
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^']).decode().strip() == '17b0f3c046c63af6993b88f3ecbab720418d8ad3'
          original_html = Path('learn.html').read_text()
          def replace_once(text, old, new):
              assert text.count(old) == 1, f'Expected one occurrence: {old[:100]}'
              return text.replace(old, new, 1)
          census = 'Census figures tell us about people living in an area at a particular time. Check the area covered before comparing numbers.'
          old_garden = 'Jimi Blake and Hunting Brook Gardens is made up of five acres of contemporary exotic gardens and fifteen acres of woodland gardens'
          garden = 'Hunting Brook Gardens is a short drive westward and is made up of five acres of contemporary exotic gardens and fifteen acres of woodland gardens.'
          welcome_description = 'Explore visitor information and things to see in Saggart through Dublin’s Outdoors.'
          path = Path('assets/data/content.js')
          text = replace_once(path.read_text(), census, '')
          text = replace_once(text, old_garden, garden)
          path.write_text(text)
          path = Path('assets/data/history-photos.js')
          text = replace_once(path.read_text(), '"title": "Welcome to the village"', '"title": "Welcome"')
          text = replace_once(text, welcome_description, '')
          path.write_text(text)
          path = Path('scripts/history-gallery.mjs')
          text = replace_once(path.read_text(), '<p class="gallery-topic">${escape(photo.label)}</p>', '${photo.label !== photo.title ? `<p class="gallery-topic">${escape(photo.label)}</p>` : \'\'}')
          text = replace_once(text, '<p>${escape(photo.description)}</p>', '${photo.description ? `<p>${escape(photo.description)}</p>` : \'\'}')
          text = replace_once(text, '<span class="sr-only">: ${escape(photo.title)}</span>', '${photo.label !== photo.title ? `<span class="sr-only">: ${escape(photo.title)}</span>` : \'\'}')
          path.write_text(text)
          path = Path('learn.html')
          text = replace_once(path.read_text(), '<p>' + census + '</p>', '')
          text = replace_once(text, old_garden, garden)
          text = replace_once(text, '        <p class="gallery-topic">Welcome</p>', '')
          text = replace_once(text, '<h3 id="title-photo-welcome" data-gallery-title>Welcome to the village</h3>', '<h3 id="title-photo-welcome" data-gallery-title>Welcome</h3>')
          text = replace_once(text, '        <p>' + welcome_description + '</p>', '')
          text = replace_once(text, '<span class="sr-only">: Welcome to the village</span>', '')
          path.write_text(text)
          for pattern in [r'<img\b[^>]*>', r'<a\b[^>]*>', r'<script\b[^>]*>', r'<link\b[^>]*>', r'<footer\b[\s\S]*?</footer>']:
              assert re.findall(pattern, original_html) == re.findall(pattern, text), pattern
          expected = {
              'learn.html': 'f3abd51aee456d724135a5efa060a7c7ce6ba2f5',
              'assets/data/content.js': '1f9ddce6295c41140d72085429c7f292243d1d15',
              'assets/data/history-photos.js': '97eb34da275523928de8a058c1dcc8cbb510d958',
              'scripts/history-gallery.mjs': 'a4bda39c92f880d130753b9cd403a6d8c74ed166',
          }
          for path, sha in expected.items():
              assert subprocess.check_output(['git', 'hash-object', path]).decode().strip() == sha, path
          print('All four edited files match the locally verified bytes; image, link, script, stylesheet and footer markup is unchanged.')
          PY
      - name: Add focused content regression checks
        shell: bash
        run: |
          cat > tests/explore-copy.test.js <<'JS'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { learningSections } from '../assets/data/content.js';
          import { historyPhotos } from '../assets/data/history-photos.js';
          import { renderHistoryGallery } from '../scripts/history-gallery.mjs';

          const html = readFileSync(new URL('../learn.html', import.meta.url), 'utf8');

          test('population introduction is removed without removing population cards or sources', () => {
            assert.equal(learningSections.find(section => section.id === 'people').intro, '');
            assert.doesNotMatch(html, /Census figures tell us about people living in an area at a particular time/);
            assert.match(html, /<h2>People and population<\/h2><\/div>/);
            assert.match(html, /Census 2022 counted 4,573 people/);
            assert.equal(learningSections.find(section => section.id === 'people').items.length, 4);
          });

          test('Hunting Brook Gardens uses the requested copy and retains its note and source', () => {
            const garden = learningSections.find(section => section.id === 'nature').items.find(item => item.source === 'huntingBrook');
            const expected = 'Hunting Brook Gardens is a short drive westward and is made up of five acres of contemporary exotic gardens and fifteen acres of woodland gardens.';
            assert.equal(garden.body, expected);
            assert.ok(html.includes(`<p>${expected}</p>`));
            assert.equal(garden.note, 'Courses<br>Tours, Lectures and more');
            assert.ok(html.includes('href="https://www.huntingbrookgardens.com/visit-the-gardens"'));
          });

          test('Welcome has one caption heading and retains its original image and controls', () => {
            const photo = historyPhotos.find(item => item.id === 'photo-welcome');
            assert.equal(photo.label, 'Welcome');
            assert.equal(photo.title, 'Welcome');
            assert.equal(photo.description, '');
            assert.ok(html.includes(renderHistoryGallery()), 'The published gallery must match its renderer');
            const slide = html.match(/<figure class="gallery-slide" id="photo-welcome"[\s\S]*?<\/figure>/)?.[0];
            assert.ok(slide);
            assert.match(slide, /<h3 id="title-photo-welcome" data-gallery-title>Welcome<\/h3>/);
            assert.doesNotMatch(slide, /gallery-topic|<p[\s>]|Welcome to the village|Explore visitor information/);
            assert.match(slide, /data-gallery-open hidden>View full photograph<\/button>/);
            assert.equal(photo.source, 'https://www.dublinsoutdoors.ie/visit/our-villages/saggart/');
            assert.ok(slide.includes(`href="${photo.source}" target="_blank" rel="noopener noreferrer"`));
            const image = readFileSync(new URL('../' + photo.src, import.meta.url));
            assert.equal(createHash('sha256').update(image).digest('hex'), 'f2e34f56625fd2ff079aa831fcd4e8947898b7af582daad91ce1fe34d70e7077');
            assert.equal(historyPhotos.length, 6);
          });
          JS
          test "$(git hash-object tests/explore-copy.test.js)" = '6c14dff389fa74db9233ef8cb7da531f346e305e'
      - name: Run the complete unit suite
        run: npm test
      - name: Commit only verified text changes and remove this one-off workflow
        shell: bash
        run: |
          rm .github/workflows/apply-explore-copy.yml
          git add learn.html assets/data/content.js assets/data/history-photos.js scripts/history-gallery.mjs tests/explore-copy.test.js .github/workflows/apply-explore-copy.yml
          python3 - <<'PY'
          import subprocess
          expected = {'learn.html', 'assets/data/content.js', 'assets/data/history-photos.js', 'scripts/history-gallery.mjs', 'tests/explore-copy.test.js', '.github/workflows/apply-explore-copy.yml'}
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only']).decode().splitlines())
          assert changed == expected, changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply requested population, garden and Welcome text edits'
          git push origin HEAD:refs/heads/fix/explore-copy-20261016
