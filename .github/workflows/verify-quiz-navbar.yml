name: Verify Quiz navbar
on:
  push:
    branches: [fix/quiz-navbar-20261016]
    paths: [.github/workflows/verify-quiz-navbar.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add the native Quiz link without changing other content
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = sorted(Path('.').glob('*.html'))
          changed = []
          marker = '<li><a href="learn.html" data-nav="learn">Explore the area</a></li>'
          nav_pattern = r'<ul\b[^>]*\bid="site-menu"[^>]*>.*?</ul>'
          for path in files:
              original = path.read_text()
              menus = list(re.finditer(nav_pattern, original, re.S))
              assert len(menus) == 1, f'{path}: expected one main menu'
              match = menus[0]
              nav = match.group()
              assert nav.count(marker) == 1, f'{path}: expected the existing Explore link'
              assert 'data-nav="quiz"' not in nav, f'{path}: Quiz already present'
              current = ' aria-current="page"' if path.name == 'quiz.html' else ''
              entry = '<li><a href="quiz.html" data-nav="quiz"' + current + '>Quiz</a></li>'
              updated_nav = nav.replace(marker, marker + '\n' + entry, 1)
              assert updated_nav.replace('\n' + entry, '', 1) == nav
              updated = original[:match.start()] + updated_nav + original[match.end():]
              assert updated.replace('\n' + entry, '', 1) == original
              path.write_text(updated)
              changed.append(path.name)
          assert len(changed) == 11, changed
          print('Quiz added after Explore the area on:', ', '.join(changed))
          PY
          cat > tests/quiz-navigation.test.js <<'JS'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import { readdirSync, readFileSync } from 'node:fs';

          const pages = readdirSync('.').filter(name => name.endsWith('.html'));
          test('every page has one native Quiz navigation link with the existing menu intact', () => {
            assert.equal(pages.length, 11);
            for (const name of pages) {
              const html = readFileSync(name, 'utf8');
              const nav = html.match(/<ul\b[^>]*\bid="site-menu"[^>]*>[\s\S]*?<\/ul>/)?.[0];
              assert.ok(nav, name);
              const expected = ['learn', 'quiz', 'services', 'contact', 'facts', 'about'];
              assert.deepEqual([...nav.matchAll(/data-nav="([^"]+)"/g)].map(match => match[1]), expected, name);
              const links = [...nav.matchAll(/<a\b[^>]*data-nav="quiz"[^>]*>Quiz<\/a>/g)];
              assert.equal(links.length, 1, name);
              assert.match(links[0][0], /href="quiz\.html"/);
              assert.doesNotMatch(links[0][0], /target=|onclick=/);
              assert.equal(links[0][0].includes('aria-current="page"'), name === 'quiz.html', name);
              assert.equal(new URL('quiz.html', 'https://samobrienolinger.github.io/saggart-and-citywest-together/' + name).href,
                'https://samobrienolinger.github.io/saggart-and-citywest-together/quiz.html');
            }
          });
          JS
          cat > e2e/quiz-navigation.spec.js <<'JS'
          import { test, expect } from '@playwright/test';
          import { readdirSync } from 'node:fs';

          const pages = readdirSync('.').filter(name => name.endsWith('.html')).sort();
          const quiz = page => page.locator('#site-menu a[data-nav="quiz"]');
          async function openMenu(page) {
            await expect(page.locator('.site-header')).toHaveClass(/nav-ready/);
            const toggle = page.locator('.nav-toggle');
            if (await toggle.isVisible() && await toggle.getAttribute('aria-expanded') !== 'true') {
              await toggle.click();
            }
            await expect(quiz(page)).toBeVisible();
          }

          test('all pages expose the same Quiz link and retain current-page indication', async ({ page }) => {
            test.setTimeout(120000);
            for (const name of pages) {
              await page.goto('/' + name);
              await openMenu(page);
              await expect(quiz(page)).toHaveCount(1);
              await expect(quiz(page)).toHaveAccessibleName('Quiz');
              await expect(quiz(page)).toHaveAttribute('href', 'quiz.html');
              await expect(page.locator('#site-menu a[data-nav]').nth(1)).toHaveText('Quiz');
              if (name === 'quiz.html') await expect(quiz(page)).toHaveAttribute('aria-current', 'page');
              else await expect(quiz(page)).not.toHaveAttribute('aria-current', 'page');
            }
          });

          test('pointer and keyboard navigation reach the working quiz in the same tab', async ({ page, hasTouch }) => {
            for (const method of ['pointer', 'keyboard']) {
              await page.goto('/index.html');
              await openMenu(page);
              if (method === 'keyboard') await quiz(page).press('Enter');
              else if (hasTouch) await quiz(page).tap();
              else await quiz(page).click();
              await expect(page).toHaveURL(/\/quiz\.html$/);
              await expect(page.locator('body')).toHaveAttribute('data-page', 'quiz');
              await expect(quiz(page)).toHaveAttribute('aria-current', 'page');
              await expect(page.locator('#start-quiz')).toBeVisible();
              await page.locator('#start-quiz').click();
              await expect(page.locator('#question-panel')).toBeVisible();
              await expect(page.locator('#answer-options button')).toHaveCount(4);
            }
          });

          test('the additional pill fits phone, tablet and desktop navigation layouts', async ({ page }, info) => {
            await page.emulateMedia({ reducedMotion: 'reduce' });
            await page.goto('/index.html');
            for (const width of [320, 390, 768, 1120, 1121, 1200, 1440]) {
              await page.setViewportSize({ width, height: 1000 });
              await openMenu(page);
              const dimensions = await quiz(page).evaluate(link => {
                const rect = link.getBoundingClientRect();
                const root = document.documentElement;
                const style = getComputedStyle(link);
                const peer = getComputedStyle(document.querySelector('#site-menu a[data-nav="learn"]'));
                return { left: rect.left, right: rect.right, height: rect.height,
                  client: root.clientWidth, scroll: root.scrollWidth,
                  style: [style.backgroundColor, style.color, style.borderRadius, style.font],
                  peer: [peer.backgroundColor, peer.color, peer.borderRadius, peer.font] };
              });
              expect(dimensions.height).toBeGreaterThanOrEqual(48);
              expect(dimensions.left).toBeGreaterThanOrEqual(-1);
              expect(dimensions.right).toBeLessThanOrEqual(dimensions.client + 1);
              expect(dimensions.scroll).toBeLessThanOrEqual(dimensions.client + 1);
              expect(dimensions.style).toEqual(dimensions.peer);
              if (width === 390 || width === 1440) {
                await page.locator('.site-header').screenshot({ path: info.outputPath(`quiz-navbar-${width}.png`) });
              }
            }
          });

          test('the Quiz navigation link also works without JavaScript', async ({ browser, baseURL }) => {
            const context = await browser.newContext({ javaScriptEnabled: false, viewport: { width: 390, height: 1000 } });
            try {
              const page = await context.newPage();
              await page.goto(new URL('/index.html', baseURL).href);
              await expect(quiz(page)).toBeVisible();
              await quiz(page).click();
              await expect(page).toHaveURL(/\/quiz\.html$/);
              await expect(quiz(page)).toHaveAttribute('aria-current', 'page');
            } finally { await context.close(); }
          });
          JS
      - run: npm ci
      - name: Run existing and new unit checks
        run: npm test
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify the navbar across the eight existing browser profiles
        run: npx playwright test e2e/quiz-navigation.spec.js --retries=0
      - name: Commit only the verified navbar and tests
        shell: bash
        run: |
          git diff --exit-code -- assets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' tests/quiz-navigation.test.js e2e/quiz-navigation.spec.js
          git rm .github/workflows/verify-quiz-navbar.yml
          git commit -m 'Add Quiz to the shared navbar on every page' -m 'Add a native same-tab quiz.html link immediately after Explore the area. Reuse the existing pill styling and current-page handling. Preserve all other HTML, JavaScript, CSS, images and quiz functionality. Unit tests and focused browser checks passed before this commit.'
          git push origin HEAD:fix/quiz-navbar-20261016
          echo "Verified commit: $(git rev-parse HEAD)"
          echo "Verified tree: $(git rev-parse HEAD^{tree})"
          git diff --stat 9328547b8eb9f949c00a47e2c0bd7bb6d30aabcc HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiz-navbar-proof
          path: |
            test-results/
            playwright-report/
          retention-days: 7
