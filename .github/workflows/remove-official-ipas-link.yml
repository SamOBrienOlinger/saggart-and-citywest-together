name: Remove homepage IPAS external link

on:
  push:
    branches: [feat/ui-ux-refinements-20261014]
    paths: [.github/workflows/remove-official-ipas-link.yml]

permissions:
  contents: write

jobs:
  apply-and-check:
    if: github.repository == 'SamOBrienOlinger/saggart-and-citywest-together' && github.ref == 'refs/heads/feat/ui-ux-refinements-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply the exact reviewed removal and update its regression assertions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              'index.html': 'fd1cdb4e89408d0221e48e7808b8e4fc457155fe',
              'e2e/site.spec.js': 'f40c8ade483d0d189f80e18a92ab35738c6a51f1',
              'tests/ui-refinements.test.js': '1b28a51f082429d2d3d0cee8789cdd4d3bfcb970',
          }
          for name, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              assert actual == sha, f'Refusing to overwrite changed source: {name}'

          def replace_once(name, old, new):
              path = Path(name)
              original = path.read_text()
              assert original.count(old) == 1, f'Expected exactly one match in {name}'
              path.write_text(original.replace(old, new, 1))

          paragraph = '<p class="container official-service-link"><a href="https://ipas.irishimmigration.ie/" target="_blank" rel="noopener noreferrer">Official IPAS website<span class="sr-only"> (opens in a new tab)</span></a></p>'
          replace_once('index.html', paragraph, '')
          replace_once('e2e/site.spec.js',
              "  await expect(page.getByRole('link', { name: /^Official IPAS website/ })).toHaveAttribute('href', 'https://ipas.irishimmigration.ie/');",
              "  await expect(page.locator('#local-services').getByRole('link', { name: /^Official IPAS website/ })).toHaveCount(0);\n  await expect(page.locator('#local-services a[href=\"https://ipas.irishimmigration.ie/\"]')).toHaveCount(0);\n  await expect(page.locator('#local-services .official-service-link')).toHaveCount(0);")
          replace_once('tests/ui-refinements.test.js',
              'local services precede community content and distinguish the local guide from IPAS',
              'local services precede community content and retain the local Citywest guide without the removed external link')
          replace_once('tests/ui-refinements.test.js',
              '  assert.match(home, /Official IPAS website/);',
              '  assert.doesNotMatch(home, /Official IPAS website/);')
          replace_once('tests/ui-refinements.test.js',
              r'  assert.match(home, /href="https:\/\/ipas\.irishimmigration\.ie\/" target="_blank"/);',
              r'  assert.doesNotMatch(home, /href="https:\/\/ipas\.irishimmigration\.ie\/"/);' + '\n  assert.doesNotMatch(home, /class="container official-service-link"/);')

          # Only the highlighted paragraph is removed from production; no empty spacer remains.
          original = subprocess.check_output(['git', 'show', 'HEAD:index.html'])
          assert Path('index.html').read_bytes() == original.replace(paragraph.encode(), b'', 1)
          assert 'Our guide to local organisations and advice.' in Path('index.html').read_text()
          assert '<a href="citywest-supports.html"><svg' in Path('index.html').read_text()
          # This is a one-time patch transport, not a permanent workflow.
          Path('.github/workflows/remove-official-ipas-link.yml').unlink()
          PY
          git diff --check
          git diff --stat
      - run: npm ci
      - run: npm test
      - name: Install focused test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Check homepage and no-JavaScript routes on desktop and iPhone emulation
        run: npm run test:browser -- e2e/site.spec.js --grep 'approved homepage order, service destinations and visual evidence|essential navigation, services and contact remain available' --project=chromium-desktop --project=webkit-iphone-emulation --workers=1 --retries=0
      - name: Commit only the reviewed change to the preview branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html e2e/site.spec.js tests/ui-refinements.test.js .github/workflows/remove-official-ipas-link.yml
          git commit -m 'fix: remove Official IPAS website link from homepage services'
          git push origin HEAD:refs/heads/feat/ui-ux-refinements-20261014
          echo "Verified commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve focused browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-ipas-link-removal-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
